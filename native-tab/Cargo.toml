[package]
name = "native_tab"
version = "0.1.0"
edition = "2024"
description = "Native tab list companion for the Lazarus Pumpkin port"
authors = ["Lazarus Pumpkin port"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
# Must match the exact Pumpkin revision the server binary was built from,
# otherwise PUMPKIN_API_VERSION (link-time ABI guard) will differ and the
# server will refuse to load the library.
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
pumpkin-api-macros = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
