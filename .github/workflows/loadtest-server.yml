name: Loadtest Server (split Pumpkin/proxy)

# Levanta Pumpkin y el proxy en DOS runners x86_64 distintos, unidos por Tailscale.
# - job `server`: compila el WASM, corre Pumpkin (25566 en el tailnet) + sampler.
# - job `proxy-velocity` (default): Velocity 3.5.1 + ViaVersion/ViaBackwards/ViaRewind
#   escuchando en 25565 y apuntando a Pumpkin + sampler.
# - job `proxy-viaproxy`: variante A/B con ViaProxy 3.4.14.
#
# Motivo del split: la traduccion 1.8.9 -> 26.3 consume 2.5-3.3 cores y en un solo
# runner de 4 vCPU se comia el CPU de Pumpkin (MSPT > 1.2 s con ~95 bots). Asi cada
# proceso tiene su propio host de 4 vCPU.
#
# Por que Velocity 3.5.1 y no 4.x: 4.0 exige Java 25 y el ecosistema de plugins
# todavia va por detras; 3.5.1 es el canal RECOMMENDED de PaperMC y corre en Java 21.
#
# Flujo:
#   1. workflow_dispatch (minutes = ventana de vida).
#   2. Buscar `JOIN_READY tcp://IP:25565` (IP del runner de ViaProxy).
#   3. Entrar con cliente 1.8.9 y luego disparar Loadtest con esa IP.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos que la pila queda arriba'
        required: true
        default: '45'
      motd:
        description: 'MOTD'
        required: true
        default: 'Lazarus CI loadtest'
      proxy:
        description: 'Proxy a usar'
        required: true
        default: velocity
        type: choice
        options:
          - velocity
          - viaproxy
      set_spawn:
        description: 'Fijar setworldspawn (usar spawn en tierra firme)'
        required: true
        default: false
        type: boolean
      spawn:
        description: 'Coordenadas de setworldspawn: x y z'
        required: false
        default: '103 78 -317'
      deathban_minutes:
        description: 'DEATHBAN.DEFAULT_BAN_TIME (0 = sin ban, ENABLED sigue true)'
        required: false
        default: '180'
      packet_limit:
        description: 'max_packet_rate del host por conexion (packets/s)'
        required: false
        default: '500'
      pvp_protection_seconds:
        description: 'PVP_PROTECTION.DURATION (0 = sin proteccion, bots se matan)'
        required: false
        default: '3600'

concurrency:
  group: loadtest-server
  cancel-in-progress: true

env:
  MINUTES: ${{ github.event.inputs.minutes }}
  MOTD: ${{ github.event.inputs.motd }}
  PROXY_KIND: ${{ github.event.inputs.proxy }}
  SET_SPAWN: ${{ github.event.inputs.set_spawn }}
  SPAWN: ${{ github.event.inputs.spawn }}
  DEATHBAN_MINUTES: ${{ github.event.inputs.deathban_minutes }}
  PACKET_LIMIT: ${{ github.event.inputs.packet_limit }}
  PVP_PROTECTION_SECONDS: ${{ github.event.inputs.pvp_protection_seconds }}
  PUMPKIN_TAG: '0.2.0+26.3-26.51'
  PUMPKIN_SHA256: '68c4416ca9fbfb3f2aeb6a8ce1de0e3fb02c5a85a53c8ba59a27941d7e43d8cd'
  VIAPROXY_JAR: 'ViaProxy-3.4.14.jar'
  VIAPROXY_URL: 'https://github.com/ViaVersion/ViaProxy/releases/download/v3.4.14/ViaProxy-3.4.14.jar'
  VELOCITY_URL: 'https://fill-data.papermc.io/v1/objects/b4e3164df5377346854dc6cb9e6a78022b1946ff69e89676313f5f6f1c6f0fb3/velocity-3.5.1-615.jar'
  VELOCITY_SHA256: 'b4e3164df5377346854dc6cb9e6a78022b1946ff69e89676313f5f6f1c6f0fb3'
  VIAVERSION_URL: 'https://github.com/ViaVersion/ViaVersion/releases/download/5.12.1/ViaVersion-5.12.1.jar'
  VIABACKWARDS_URL: 'https://github.com/ViaVersion/ViaBackwards/releases/download/5.12.1/ViaBackwards-5.12.1.jar'
  VIAREWIND_URL: 'https://github.com/ViaVersion/ViaRewind/releases/download/4.2.0/ViaRewind-4.2.0.jar'

jobs:
  server:
    name: pumpkin
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Rust (wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Compilar plugin WASM
        run: |
          set -euo pipefail
          cargo build --release
          ls -lh target/wasm32-wasip2/release/lazarus_pumpkin.wasm

      - name: Unirse al tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: lazarus-ci-server-${{ github.run_id }}

      - name: Preparar server
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          curl -fsSL -o server/pumpkin \
            "https://github.com/Pumpkin-MC/Pumpkin/releases/download/${PUMPKIN_TAG//+/%2B}/pumpkin-X64-Linux"
          echo "${PUMPKIN_SHA256}  server/pumpkin" | sha256sum -c -
          chmod +x server/pumpkin
          cp loadtest/server/pumpkin.toml server/pumpkin.toml
          sed -i "s|^motd = .*|motd = \"${MOTD}\"|" server/pumpkin.toml
          # Dejar que el plugin cree su config default. Inyectar una config
          # con DEATHBAN.ENABLED=false congela el tick en los joins (bug
          # reproducido en B3/B4/B5/B6). El deathban queda ON; el join ya
          # resuelve un spawn seguro (y=79) y el monitor aplica resistencia
          # antes de move/fight para que no haya muertes.
          # Con Velocity, la compresion la hace solo el proxy (FAQ oficial):
          # el backend no debe comprimir para no obligar al proxy a descomprimir/recomprimir.
          if [ "${PROXY_KIND:-velocity}" != "viaproxy" ]; then
            sed -i '/^\[networking\.java\.compression\]/,/^$/ s/^enabled = true/enabled = false/' server/pumpkin.toml
          fi
          echo '--- compression backend ---'
          sed -n '/^\[networking\.java\.compression\]/,/^$/p' server/pumpkin.toml
          # El limiter del host es por conexion; detras de Velocity los 100 bots
          # comparten IP y algunos superan 500/s por bursts de Mineflayer.
          sed -i "s/^max_packet_rate = .*/max_packet_rate = ${PACKET_LIMIT:-500}/" server/pumpkin.toml
          sed -i "s/^burst_capacity = .*/burst_capacity = ${PACKET_LIMIT:-500}/" server/pumpkin.toml
          grep -nE 'max_packet_rate|burst_capacity' server/pumpkin.toml | head -4
          cp target/wasm32-wasip2/release/lazarus_pumpkin.wasm server/plugins/lazarus_pumpkin.wasm
          if [ -f loadtest/server/native_tab-x86_64.so ]; then
            cp loadtest/server/native_tab-x86_64.so server/plugins/native_tab.so
          fi
          ls -la server server/plugins
          echo "--- CPU del runner (pumpkin) ---"
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor' || true
          free -m | head -2

      - name: Iniciar Pumpkin
        run: |
          set -uo pipefail
          cd server

          TS_IP=$(tailscale ip -4 | head -1)
          echo "SERVER_IP=${TS_IP}"

          nohup ./pumpkin > pumpkin.log 2>&1 &
          PUMPKIN_PID=$!
          echo "PUMPKIN_PID=$PUMPKIN_PID" >> "$GITHUB_ENV"

          ready=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$PUMPKIN_PID" 2>/dev/null; then break; fi
            if python3 ../loadtest/server/rcon.py tps lazarus-test 127.0.0.1 25575 >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "ERROR: Pumpkin no respondio por RCON"; tail -80 pumpkin.log; exit 1
          fi
          for _ in $(seq 1 30); do
            grep -q "Started server" pumpkin.log && break
            sleep 2
          done
          echo "--- Pumpkin listo ---"
          grep -iE "Started server|lazarus|kitmap|plugin" pumpkin.log | tail -12 || true

          echo "--- rcon ---"
          python3 ../loadtest/server/rcon.py list lazarus-test 127.0.0.1 25575 || true
          python3 ../loadtest/server/rcon.py tps lazarus-test 127.0.0.1 25575 || true
          # Spawn del host (opcional). El spawn por defecto cae sobre agua y
          # los bots se ahogan; usar coordenadas en tierra firme (la arena).
          if [ "${SET_SPAWN:-false}" = "true" ]; then
            python3 ../loadtest/server/rcon.py "setworldspawn ${SPAWN:-103 78 -317}" \
              lazarus-test 127.0.0.1 25575 || true
          fi

          # Deathban con ban de 0 minutos: mantiene ENABLED=true (el disabled
          # congela el tick) pero deja que los bots reaparezcan tras morir en
          # PvP, para sostener 100 durante todo el test.
          if [ -f plugins/data/lazarus/config.yml ]; then
            echo "--- deathban config ---"
            grep -nE '^DEATHBAN:|^  ENABLED:|^  DEFAULT_BAN_TIME:' \
              plugins/data/lazarus/config.yml | head -6 || true
            changed=false
            if [ "${DEATHBAN_MINUTES:-180}" != "180" ]; then
              sed -i "s/^  DEFAULT_BAN_TIME: .*/  DEFAULT_BAN_TIME: ${DEATHBAN_MINUTES}/" \
                plugins/data/lazarus/config.yml
              changed=true
            fi
            if [ "${PVP_PROTECTION_SECONDS:-3600}" != "3600" ]; then
              sed -i "/^PVP_PROTECTION:/,/^[A-Z]/ s/^  DURATION: .*/  DURATION: ${PVP_PROTECTION_SECONDS}/" \
                plugins/data/lazarus/config.yml
              changed=true
            fi
            if [ "$changed" = "true" ]; then
              python3 ../loadtest/server/rcon.py "lazarus reload" \
                lazarus-test 127.0.0.1 25575 || true
            fi
          fi

          PUMPKIN_PID=$PUMPKIN_PID \
            nohup python3 ../loadtest/server/sampler.py --out sampler.csv --interval 5 > sampler.log 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

          {
            echo "## Pumpkin listo (split)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Backend (tailnet) | \`${TS_IP}:25566\` |"
            echo "| RCON (tailnet) | \`${TS_IP}:25575\` |"
            echo "| Ventana | ${MINUTES} min |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SERVER_READY tcp://${TS_IP}:25566"

      - name: Mantener Pumpkin arriba
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$PUMPKIN_PID" 2>/dev/null; then
              echo "ERROR: Pumpkin murio"
              tail -80 server/pumpkin.log
              exit 1
            fi
            LAST=$(tail -1 server/sampler.log 2>/dev/null || true)
            echo "[$(date -u +%H:%M:%S)] ${LAST:-sin muestras}"
            sleep 30
          done

      - name: Stack dump si el tick se congelo
        if: always()
        run: |
          set +e
          if [ -n "${PUMPKIN_PID:-}" ] && kill -0 "$PUMPKIN_PID" 2>/dev/null; then
            if ! command -v gdb >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq gdb
            fi
            sudo gdb -q -batch -p "$PUMPKIN_PID" \
              -ex 'set pagination off' \
              -ex 'thread apply all bt' > server/stack.txt 2>&1
            echo '--- stack.txt (cola) ---'
            tail -60 server/stack.txt
          fi

      - name: Bajar todo
        if: always()
        run: |
          set +e
          for p in "${SAMPLER_PID:-}" "${PUMPKIN_PID:-}"; do
            [ -n "$p" ] && kill "$p" 2>/dev/null
          done
          sleep 8
          echo '--- pumpkin.log (cola) ---'; tail -40 server/pumpkin.log 2>/dev/null
          echo '--- sampler.log (cola) ---'; tail -10 server/sampler.log 2>/dev/null

      - name: Subir artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-server
          path: |
            server/pumpkin.log
            server/logs/latest.log
            server/sampler.csv
            server/sampler.log
            server/stack.txt
            server/pumpkin.toml
            server/plugins/data/lazarus/config.yml
            server/plugins/data/lazarus/utilities.yml
          if-no-files-found: warn
          retention-days: 7

  proxy-velocity:
    name: velocity
    if: ${{ github.event.inputs.proxy != 'viaproxy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unirse al tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: lazarus-ci-proxy-${{ github.run_id }}

      - name: Descargar Velocity 3.5.1
        run: |
          set -euo pipefail
          mkdir -p proxy
          curl -fsSL -o proxy/velocity.jar "${VELOCITY_URL}"
          echo "${VELOCITY_SHA256}  proxy/velocity.jar" | sha256sum -c -
          ls -lh proxy/velocity.jar
          echo "--- CPU del runner (velocity) ---"
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor' || true
          free -m | head -2

      - name: Generar velocity.toml por defecto
        run: |
          set -uo pipefail
          cd proxy
          timeout 20 java -jar velocity.jar > first-run.log 2>&1 || true
          if [ ! -f velocity.toml ]; then
            echo "ERROR: Velocity no genero velocity.toml"
            tail -80 first-run.log
            exit 1
          fi
          echo '--- velocity.toml generado ---'
          grep -vE '^\s*#|^\s*$' velocity.toml | head -45

      - name: Esperar Pumpkin y arrancar Velocity
        run: |
          set -uo pipefail
          cd proxy

          TS_IP=$(tailscale ip -4 | head -1)
          echo "PROXY_IP=${TS_IP}"

          SRV_IP=""
          for _ in $(seq 1 120); do
            for ip in $(tailscale status | grep "lazarus-ci-server-${{ github.run_id }}" | grep -v offline | awk '{print $1}'); do
              if (exec 3<>/dev/tcp/$ip/25566) 2>/dev/null; then SRV_IP=$ip; break; fi
            done
            [ -n "$SRV_IP" ] && break
            sleep 5
          done
          if [ -z "$SRV_IP" ]; then
            echo "ERROR: no encontre Pumpkin en el tailnet"; tailscale status; exit 1
          fi
          echo "backend=${SRV_IP}:25566"

          MOTD_ESC="${MOTD//\"/}"
          sed -i 's|^online-mode = .*|online-mode = false|' velocity.toml
          sed -i 's|^player-info-forwarding-mode = .*|player-info-forwarding-mode = "none"|' velocity.toml
          sed -i "s|^motd = .*|motd = \"${MOTD_ESC}\"|" velocity.toml
          sed -i "s|^lobby = .*|lobby = \"${SRV_IP}:25566\"|" velocity.toml
          sed -i 's|^compression-threshold = .*|compression-threshold = 1024|' velocity.toml
          sed -i 's|^compression-level = .*|compression-level = 1|' velocity.toml
          if ! grep -q '^compression-level' velocity.toml; then
            sed -i '/^compression-threshold/a compression-level = 1' velocity.toml
          fi
          sed -i 's|^login-ratelimit = .*|login-ratelimit = 0|' velocity.toml
          sed -i 's|^tcp-fast-open = .*|tcp-fast-open = true|' velocity.toml
          sed -i 's|^enable-player-address-logging = .*|enable-player-address-logging = false|' velocity.toml
          sed -i 's|^log-player-connections = .*|log-player-connections = false|' velocity.toml
          if ! grep -q '^enable-reuse-port' velocity.toml; then
            sed -i '/^\[advanced\]/a enable-reuse-port = true' velocity.toml
          else
            sed -i 's|^enable-reuse-port = .*|enable-reuse-port = true|' velocity.toml
          fi

          mkdir -p plugins
          curl -fsSL -o plugins/ViaVersion.jar "${VIAVERSION_URL}"
          curl -fsSL -o plugins/ViaBackwards.jar "${VIABACKWARDS_URL}"
          curl -fsSL -o plugins/ViaRewind.jar "${VIAREWIND_URL}"
          ls -lh plugins

          echo '--- config final ---'
          grep -vE '^\s*#|^\s*$' velocity.toml | head -50

          nohup java -Xms1g -Xmx2g -XX:+UseG1GC -XX:G1HeapRegionSize=4M \
            -XX:+UnlockExperimentalVMOptions -XX:+ParallelRefProcEnabled \
            -XX:+AlwaysPreTouch -XX:MaxInlineLevel=15 \
            -jar velocity.jar > velocity.log 2>&1 &
          VELOCITY_PID=$!
          echo "VELOCITY_PID=$VELOCITY_PID" >> "$GITHUB_ENV"

          vready=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$VELOCITY_PID" 2>/dev/null; then break; fi
            if (exec 3<>/dev/tcp/127.0.0.1/25565) 2>/dev/null; then vready=1; break; fi
            sleep 2
          done
          if [ "$vready" != "1" ]; then
            echo "ERROR: Velocity no abrio 25565"
            tail -120 velocity.log
            exit 1
          fi
          for _ in $(seq 1 30); do
            grep -q 'Done (' velocity.log && break
            sleep 2
          done
          echo '--- Velocity listo ---'
          grep -iE 'Loading plugins|Loaded plugin|Done \(|Listening|viaversion|viabackwards|viarewind|error' velocity.log | tail -30 || true

          if ! grep -qi 'viaversion' velocity.log; then
            echo "WARN: ViaVersion no aparece en el log de Velocity"
          fi

          VELOCITY_PID=$VELOCITY_PID VIAPROXY_PID=$VELOCITY_PID \
            nohup python3 ../loadtest/server/sampler.py --no-rcon --out velocity.csv --interval 5 > sampler.log 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

          {
            echo "## Velocity listo (split)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Join (Tailscale) | \`${TS_IP}:25565\` |"
            echo "| Proxy | Velocity 3.5.1 (offline, forwarding none) |"
            echo "| Plugins | ViaVersion 5.12.1 + ViaBackwards 5.12.1 + ViaRewind 4.2.0 |"
            echo "| Backend | \`${SRV_IP}:25566\` |"
            echo "| Ventana | ${MINUTES} min |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JOIN_READY tcp://${TS_IP}:25565"

      - name: Mantener Velocity arriba
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$VELOCITY_PID" 2>/dev/null; then
              echo "ERROR: Velocity murio"
              tail -80 proxy/velocity.log
              exit 1
            fi
            LAST=$(tail -1 proxy/sampler.log 2>/dev/null || true)
            echo "[$(date -u +%H:%M:%S)] ${LAST:-sin muestras}"
            sleep 30
          done

      - name: Bajar todo
        if: always()
        run: |
          set +e
          for p in "${SAMPLER_PID:-}" "${VELOCITY_PID:-}"; do
            [ -n "$p" ] && kill "$p" 2>/dev/null
          done
          sleep 8
          echo '--- velocity.log (cola) ---'; tail -40 proxy/velocity.log 2>/dev/null
          echo '--- sampler.log (cola) ---'; tail -10 proxy/sampler.log 2>/dev/null

      - name: Subir artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-proxy
          path: |
            proxy/velocity.log
            proxy/velocity.csv
            proxy/velocity.toml
            proxy/first-run.log
            proxy/sampler.log
          if-no-files-found: warn
          retention-days: 7

  proxy-viaproxy:
    name: viaproxy
    if: ${{ github.event.inputs.proxy == 'viaproxy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unirse al tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: lazarus-ci-proxy-${{ github.run_id }}
          args: --ssh

      - name: Descargar ViaProxy
        run: |
          set -euo pipefail
          mkdir -p proxy
          curl -fsSL -o "proxy/${VIAPROXY_JAR}" "${VIAPROXY_URL}"
          cp loadtest/server/viaproxy.yml proxy/viaproxy.yml
          ls -la proxy "proxy/${VIAPROXY_JAR}"
          echo "--- CPU del runner (viaproxy) ---"
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|MHz|Hypervisor' || true
          free -m | head -2

      - name: Esperar Pumpkin y arrancar ViaProxy
        run: |
          set -uo pipefail
          cd proxy

          TS_IP=$(tailscale ip -4 | head -1)
          echo "PROXY_IP=${TS_IP}"

          SRV_IP=""
          for _ in $(seq 1 120); do
            for ip in $(tailscale status | grep "lazarus-ci-server-${{ github.run_id }}" | grep -v offline | awk '{print $1}'); do
              if (exec 3<>/dev/tcp/$ip/25566) 2>/dev/null; then SRV_IP=$ip; break; fi
            done
            [ -n "$SRV_IP" ] && break
            sleep 5
          done
          if [ -z "$SRV_IP" ]; then
            echo "ERROR: no encontre Pumpkin en el tailnet"; tailscale status; exit 1
          fi
          echo "backend=${SRV_IP}:25566"
          sed -i "s|^target-address: .*|target-address: ${SRV_IP}:25566|" viaproxy.yml

          nohup java -Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=20 \
            -jar "${VIAPROXY_JAR}" config viaproxy.yml > viaproxy.log 2>&1 &
          VIAPROXY_PID=$!
          echo "VIAPROXY_PID=$VIAPROXY_PID" >> "$GITHUB_ENV"

          vready=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$VIAPROXY_PID" 2>/dev/null; then break; fi
            if (exec 3<>/dev/tcp/127.0.0.1/25565) 2>/dev/null; then vready=1; break; fi
            sleep 2
          done
          if [ "$vready" != "1" ]; then
            echo "ERROR: ViaProxy no abrio 25565"; tail -80 viaproxy.log; exit 1
          fi
          echo "--- ViaProxy listo ---"

          VIAPROXY_PID=$VIAPROXY_PID \
            nohup python3 ../loadtest/server/sampler.py --no-rcon --out viaproxy.csv --interval 5 > sampler.log 2>&1 &
          echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"

          {
            echo "## ViaProxy listo (split)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Join (Tailscale) | \`${TS_IP}:25565\` |"
            echo "| Cliente | 1.8.9 (ViaProxy acepta 1.7.2+) |"
            echo "| Backend | \`${SRV_IP}:25566\` |"
            echo "| Ventana | ${MINUTES} min |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JOIN_READY tcp://${TS_IP}:25565"

      - name: Túnel ngrok (opcional)
        if: ${{ env.NGROK_AUTHTOKEN != '' }}
        run: |
          set -uo pipefail
          if ! command -v ngrok >/dev/null; then
            curl -fsSL -o /tmp/ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
            sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin ngrok
          fi
          ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null
          nohup ngrok tcp 25565 --log stdout > proxy/ngrok.log 2>&1 &
          echo "NGROK_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            ADDR=$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'] if d.get('tunnels') else '')" 2>/dev/null || true)
            if [ -n "$ADDR" ]; then
              echo "NGROK_READY $ADDR"
              echo "- ngrok: \`$ADDR\`" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            sleep 2
          done

      - name: Mantener ViaProxy arriba
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$VIAPROXY_PID" 2>/dev/null; then
              echo "ERROR: ViaProxy murio"
              tail -80 proxy/viaproxy.log
              exit 1
            fi
            LAST=$(tail -1 proxy/sampler.log 2>/dev/null || true)
            echo "[$(date -u +%H:%M:%S)] ${LAST:-sin muestras}"
            sleep 30
          done

      - name: Bajar todo
        if: always()
        run: |
          set +e
          for p in "${NGROK_PID:-}" "${SAMPLER_PID:-}" "${VIAPROXY_PID:-}"; do
            [ -n "$p" ] && kill "$p" 2>/dev/null
          done
          sleep 8
          echo '--- viaproxy.log (cola) ---'; tail -30 proxy/viaproxy.log 2>/dev/null
          echo '--- sampler.log (cola) ---'; tail -10 proxy/sampler.log 2>/dev/null

      - name: Subir artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-proxy-viaproxy
          path: |
            proxy/viaproxy.log
            proxy/viaproxy.csv
            proxy/sampler.log
            proxy/viaproxy.yml
            proxy/ngrok.log
          if-no-files-found: warn
          retention-days: 7
