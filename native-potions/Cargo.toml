[package]
name = "native_potions"
version = "0.1.0"
edition = "2024"
description = "Native potion-contents component factory for the Lazarus Pumpkin port"
authors = ["Lazarus Pumpkin port"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
# Must match the exact Pumpkin revision the server binary was loaded from.
# NOTE: this manifest is only a reference; the real build injects the crate into
# Pumpkin's workspace with path deps and builds *only* the plugin target
# (see build-in-pumpkin.sh / .github/workflows/native-potions.yml).
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
pumpkin-api-macros = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
pumpkin-protocol = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
